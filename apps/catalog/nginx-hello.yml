id: nginx-hello
name: Hello
description: Minimal hello app for validating deploy and ingress flow.
category: utility
icon: hello
compose:
  template: |
    services:
      app:
        image: nginxdemos/hello:plain-text
        container_name: sy-{{INSTANCE_ID}}-app
        restart: unless-stopped
        networks:
          - selfyurt_net
    networks:
      selfyurt_net:
        external: true
  variables: []
ingress:
  targetService: app
  targetPort: 80
access:
  defaultExposePublic: true
  supportsPublic: true
  protocol: http
envSchema: []
volumes: []
notes: No persistence required.
